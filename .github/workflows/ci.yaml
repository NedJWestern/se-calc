name: Checks
on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: prek (ruff, gitleaks, pytest, file checks)
        run: uv run prek run --all-files --show-diff-on-failure
      - name: Check calculators build
        run: uv run python -m se_calc.build --no-export
