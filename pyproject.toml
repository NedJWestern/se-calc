[project]
name = "se-calc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.19.0",
    "python-lsp-server>=1.14.0",
]

[dependency-groups]
dev = [
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
